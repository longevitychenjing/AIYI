[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yijing-rag"
version = "0.1.0"
description = "Source-governed ingestion and Qdrant retrieval for 易占"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
yijing-ingest = "yijing_rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]